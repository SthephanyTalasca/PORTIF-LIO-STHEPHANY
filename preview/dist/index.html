<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STHEPHANY.DEV — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>/* =========================================================
   STHEPHANY.DEV — Design system
   Dark Tech · AI Lab · Minimalismo futurista · Bento UI
   ========================================================= */

:root {
  --bg: #09090f;
  --bg-2: #12121d;
  --card: #181825;
  --card-2: #1f1f2e;
  --violet: #8b5cf6;
  --violet-600: #7c3aed;
  --lavender: #c4b5fd;
  --pink: #ec4899;
  --white: #f8fafc;
  --muted: #a1a1aa;
  --line: rgba(196, 181, 253, 0.12);
  --line-2: rgba(196, 181, 253, 0.22);
  --glow: 0 0 0 1px rgba(139, 92, 246, 0.35), 0 18px 60px -20px rgba(139, 92, 246, 0.55);
  --radius: 20px;
  --radius-sm: 12px;
  --container: 1200px;
  --header-h: 72px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 12px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
::selection { background: rgba(139, 92, 246, 0.45); }
:focus-visible { outline: 2px solid var(--lavender); outline-offset: 3px; border-radius: 6px; }

.container { width: 100%; max-width: var(--container); margin: 0 auto; padding: 0 24px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; top: -60px; left: 16px; z-index: 100; background: var(--violet); padding: 10px 16px; border-radius: 10px; font-weight: 600; transition: top 0.2s; }
.skip-link:focus { top: 12px; }

/* ---------- Botões / chips / tags ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px; border-radius: 999px;
  font-weight: 600; font-size: 15px; border: 1px solid transparent;
  transition: transform 0.25s var(--ease), background 0.25s, border-color 0.25s, box-shadow 0.25s;
  white-space: nowrap;
}
.btn--sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn--primary { background: linear-gradient(135deg, var(--violet), var(--violet-600)); color: #fff; box-shadow: 0 10px 30px -12px rgba(139, 92, 246, 0.8); }
.btn--primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 40px -12px rgba(139, 92, 246, 0.95); }
.btn--ghost { background: rgba(255, 255, 255, 0.03); border-color: var(--line-2); color: var(--white); }
.btn--ghost:hover:not(:disabled) { border-color: var(--lavender); background: rgba(139, 92, 246, 0.1); }

.icon-btn {
  display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 999px;
  border: 1px solid var(--line-2); background: rgba(18, 18, 29, 0.7); transition: 0.25s var(--ease);
}
.icon-btn:hover:not(:disabled) { border-color: var(--lavender); background: rgba(139, 92, 246, 0.18); }
.icon-btn--sm { width: 36px; height: 36px; }
.icon-btn--accent { background: var(--violet); border-color: var(--violet); width: 42px; height: 42px; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  font-size: 13px; padding: 5px 12px; border-radius: 999px;
  background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.25); color: var(--lavender);
}
.tags--sm .tag { font-size: 12px; padding: 3px 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2);
  background: transparent; color: var(--muted); transition: 0.2s; text-align: left;
}
.chip:hover { color: var(--white); border-color: var(--lavender); }
.chip.is-active { background: rgba(139, 92, 246, 0.18); border-color: var(--violet); color: var(--white); }

.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 12px; border-radius: 999px; background: rgba(139, 92, 246, 0.16); color: var(--lavender); border: 1px solid rgba(139, 92, 246, 0.35); }
.badge--lock { background: rgba(236, 72, 153, 0.1); color: #f9a8d4; border-color: rgba(236, 72, 153, 0.3); }
.badge--soft { background: transparent; color: var(--muted); border-color: var(--line-2); }

.eyebrow {
  display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--lavender); margin-bottom: 16px;
}
.eyebrow::before { content: ""; width: 22px; height: 1px; background: linear-gradient(90deg, var(--violet), var(--pink)); }

/* ---------- Header ---------- */
.header { position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--header-h); transition: background 0.3s, border-color 0.3s, backdrop-filter 0.3s; border-bottom: 1px solid transparent; }
.header--solid { background: rgba(9, 9, 15, 0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom-color: var(--line); }
.header__inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo { display: inline-flex; align-items: center; gap: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: 0.04em; font-size: 17px; }
.logo__mark { margin-right: 10px; width: 22px; height: 22px; border-radius: 7px; background: conic-gradient(from 210deg, var(--violet), var(--pink), var(--lavender), var(--violet)); box-shadow: 0 0 22px rgba(139, 92, 246, 0.7); }
.logo__dot { color: var(--lavender); }
.header__nav ul { display: flex; gap: 4px; }
.header__nav a { display: block; padding: 8px 12px; border-radius: 999px; color: var(--muted); font-size: 14.5px; transition: color 0.2s, background 0.2s; }
.header__nav a:hover { color: var(--white); background: rgba(255, 255, 255, 0.05); }
.header__actions { display: flex; align-items: center; gap: 10px; }
.header__toggle { display: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: transparent; place-items: center; }
.mobile-menu { position: fixed; inset: var(--header-h) 0 0 0; background: rgba(9, 9, 15, 0.97); backdrop-filter: blur(16px); padding: 24px; }
.mobile-menu ul { display: grid; gap: 4px; margin-bottom: 24px; }
.mobile-menu a:not(.btn) { display: block; padding: 14px 8px; font-family: var(--font-display); font-size: 24px; border-bottom: 1px solid var(--line); }
.mobile-menu .btn { width: 100%; }

@media (max-width: 1020px) {
  .header__nav, .header__cta { display: none; }
  .header__toggle { display: inline-grid; }
}

/* ---------- Hero carousel ---------- */
.hero { position: relative; min-height: 90vh; padding-top: var(--header-h); display: flex; flex-direction: column; overflow: hidden; outline: none; }
.hero__glow { position: absolute; inset: -20% -10% auto -10%; height: 90%; pointer-events: none;
  background:
    radial-gradient(40% 50% at 75% 40%, rgba(139, 92, 246, 0.32), transparent 70%),
    radial-gradient(30% 35% at 15% 20%, rgba(236, 72, 153, 0.14), transparent 70%);
}
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px; mask-image: radial-gradient(70% 60% at 50% 40%, #000 30%, transparent 80%); -webkit-mask-image: radial-gradient(70% 60% at 50% 40%, #000 30%, transparent 80%); }
.hero__viewport { position: relative; z-index: 1; flex: 1; overflow: hidden; touch-action: pan-y; display: flex; }
.hero__track { display: flex; width: 100%; transition: transform 0.7s var(--ease); }
.hero__track.is-dragging { transition: none; }
.slide { flex: 0 0 100%; display: flex; align-items: center; padding: 40px 0 24px; }
.slide__inner { display: grid; grid-template-columns: 1.05fr 0.95fr; align-items: center; gap: 48px; }
.slide__copy > * { opacity: 0; transform: translateY(18px); transition: opacity 0.6s var(--ease), transform 0.6s var(--ease); }
.slide.is-active .slide__copy > * { opacity: 1; transform: none; }
.slide.is-active .slide__copy > *:nth-child(2) { transition-delay: 0.08s; }
.slide.is-active .slide__copy > *:nth-child(3) { transition-delay: 0.16s; }
.slide.is-active .slide__copy > *:nth-child(n+4) { transition-delay: 0.24s; }
.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lavender); margin-bottom: 22px; }
.kicker__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 14px var(--pink); }
.kicker__count { color: var(--muted); font-weight: 500; letter-spacing: 0.08em; padding-left: 10px; border-left: 1px solid var(--line-2); }
.slide__title { font-size: clamp(40px, 5.6vw, 76px); font-weight: 700; margin-bottom: 22px; background: linear-gradient(180deg, #fff 30%, var(--lavender)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.slide__desc { font-size: clamp(17px, 1.5vw, 20px); color: var(--muted); max-width: 540px; margin-bottom: 22px; }
.slide__highlights { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 18px; color: var(--white); font-weight: 500; }
.slide__highlights li { display: inline-flex; align-items: center; gap: 6px; }
.slide__highlights svg { color: var(--pink); }
.slide .tags { margin-bottom: 30px; }
.slide__actions { display: flex; flex-wrap: wrap; gap: 12px; }
.slide__visual { position: relative; }
.hero__controls { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 32px; }
.hero__progress { display: flex; gap: 10px; flex: 1; max-width: 640px; }
.hero__bar { flex: 1; background: none; border: 0; padding: 12px 0 0; text-align: left; position: relative; color: var(--muted); font-size: 12.5px; }
.hero__bar::before, .hero__bar::after { content: ""; position: absolute; top: 0; left: 0; height: 3px; border-radius: 3px; }
.hero__bar::before { right: 0; background: var(--line-2); }
.hero__bar::after { width: 0; background: linear-gradient(90deg, var(--violet), var(--pink)); transition: width 0.6s var(--ease); }
.hero__bar.is-active { color: var(--white); }
.hero__bar.is-active::after { width: 100%; }
.hero__bar-label { display: block; padding-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero__arrows { display: flex; gap: 10px; }

/* ---------- Visualizações do carrossel ---------- */
.viz { position: relative; aspect-ratio: 52 / 44; border-radius: 28px; border: 1px solid var(--line-2);
  background: linear-gradient(160deg, rgba(31, 31, 46, 0.9), rgba(18, 18, 29, 0.7)); box-shadow: var(--glow); overflow: hidden; }
.viz__svg { width: 100%; height: 100%; }
.viz__label { position: absolute; right: 16px; top: 14px; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.8; }
.vnode rect { fill: #1d1d2c; stroke: rgba(196, 181, 253, 0.28); }
.vnode--accent rect { fill: rgba(139, 92, 246, 0.22); stroke: var(--violet); }
.vnode--pink rect { fill: rgba(236, 72, 153, 0.14); stroke: rgba(236, 72, 153, 0.6); }
.vnode--core rect { fill: url(#g-agent); fill: rgba(139, 92, 246, 0.3); stroke: var(--lavender); stroke-width: 1.5; }
.vnode__t { fill: var(--white); font: 600 14px var(--font-display); }
.vnode__t--lg { font-size: 20px; }
.vnode__s { fill: var(--muted); font: 500 11px var(--font-body); }
.vring { fill: none; stroke: rgba(196, 181, 253, 0.2); stroke-dasharray: 3 7; }
.vring--faint { stroke: rgba(196, 181, 253, 0.08); }
.vline { stroke: rgba(196, 181, 253, 0.22); stroke-width: 1.3; }
.vline--flow { stroke: rgba(139, 92, 246, 0.7); stroke-dasharray: 6 8; }
.viz.is-active .vline--flow { animation: flow 1.6s linear infinite; }
.vdot { fill: rgba(196, 181, 253, 0.12); }
.vlog rect { fill: rgba(9, 9, 15, 0.8); stroke: var(--line-2); }
.vlog__ok { fill: #34d399; }
.vwin > rect:first-child { fill: #14141f; stroke: var(--line-2); }
.vwin__bar { fill: #1b1b29; }
.vwin__dot { fill: rgba(196, 181, 253, 0.3); }
.vwin__side { fill: #171724; }
.vwin__nav { fill: rgba(196, 181, 253, 0.16); }
.vwin__nav.is-on { fill: var(--violet); }
.vkpi rect:first-child { fill: #1d1d2c; stroke: var(--line); }
.vkpi__l { fill: rgba(196, 181, 253, 0.2); }
.vkpi__v { fill: rgba(248, 250, 252, 0.7); }
.vkpi__v.is-accent { fill: var(--lavender); }
.vchart > rect:first-child { fill: #1a1a28; stroke: var(--line); }
.vchart__bar { fill: rgba(139, 92, 246, 0.35); transform-origin: bottom; transform-box: fill-box; }
.vchart__bar.is-accent { fill: var(--pink); }
.viz.is-active .vchart__bar { animation: grow 0.8s var(--ease) both; }
.vchart__line { stroke: var(--lavender); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.vhub { fill: rgba(139, 92, 246, 0.28); stroke: var(--lavender); stroke-width: 1.5; }
.vpeer { fill: #232336; stroke: var(--violet); stroke-width: 1.5; }
.vpeer.is-pink { stroke: var(--pink); }
.viz.is-active .vpeer { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.vstat rect { fill: rgba(9, 9, 15, 0.82); stroke: var(--line-2); }
.vstat__v { fill: var(--white); font: 700 17px var(--font-display); }

@keyframes flow { to { stroke-dashoffset: -28; } }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes pulse { 50% { transform: scale(1.18); } }

/* ---------- Métricas ---------- */
.metrics { position: relative; z-index: 2; border-block: 1px solid var(--line); background: linear-gradient(180deg, rgba(18, 18, 29, 0.6), rgba(9, 9, 15, 0.6)); }
.metrics__list { display: grid; grid-template-columns: repeat(6, 1fr); }
.metric { padding: 34px 18px; border-left: 1px solid var(--line); opacity: 0; transform: translateY(12px); transition: opacity 0.6s var(--ease), transform 0.6s var(--ease); }
.metric:first-child { border-left: 0; padding-left: 0; }
.metrics__list.is-visible .metric { opacity: 1; transform: none; }
.metric__value { display: block; font: 700 clamp(30px, 3.2vw, 44px)/1 var(--font-display); letter-spacing: -0.03em; margin-bottom: 10px; background: linear-gradient(135deg, #fff, var(--lavender)); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
.metric__label { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.45; }

/* ---------- Seções ---------- */
.section { padding: 112px 0; position: relative; }
.section--alt { background: var(--bg-2); border-block: 1px solid var(--line); }
.section__head { max-width: 760px; margin-bottom: 48px; }
.section__title { font-size: clamp(32px, 4vw, 52px); font-weight: 700; margin-bottom: 18px; }
.section__title--sm { font-size: clamp(26px, 3vw, 36px); margin-bottom: 28px; }
.section__lead { color: var(--muted); font-size: 18px; max-width: 680px; }

.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
.reveal.is-visible { opacity: 1; transform: none; }

/* ---------- Filtros e cards ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
.filter { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.02); color: var(--muted); font-size: 14.5px; font-weight: 500; transition: 0.2s; }
.filter:hover { color: var(--white); border-color: var(--lavender); }
.filter.is-active { color: #fff; background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(124, 58, 237, 0.25)); border-color: var(--violet); }
.filter__count { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); }

.bento { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-flow: dense; gap: 20px; }
.bento--3 .pcard { grid-column: span 1; }
.pcard {
  position: relative; display: flex; flex-direction: column; border-radius: var(--radius); overflow: hidden;
  background: var(--card); border: 1px solid var(--line); transition: transform 0.35s var(--ease), border-color 0.35s, box-shadow 0.35s;
  animation: cardIn 0.5s var(--ease) both;
}
.pcard:hover, .pcard:focus-within { transform: translateY(-4px); border-color: rgba(139, 92, 246, 0.55); box-shadow: var(--glow); }
.pcard--lg { grid-column: span 2; }
.pcard--lg .pcard__media { aspect-ratio: 16 / 6.5; }
.pcard__media { position: relative; aspect-ratio: 16 / 8.5; border-bottom: 1px solid var(--line); overflow: hidden; }
.pcard__media .art { transition: transform 0.6s var(--ease); }
.pcard:hover .pcard__media .art { transform: scale(1.04); }
.pcard__badge { position: absolute; top: 12px; right: 12px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: rgba(9, 9, 15, 0.75); color: var(--muted); border: 1px solid var(--line); }
.pcard__body { display: flex; flex-direction: column; gap: 12px; padding: 22px 22px 20px; flex: 1; }
.pcard__cat { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--lavender); font-weight: 600; }
.pcard__title { font-size: 22px; font-weight: 600; }
.pcard__link::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.pcard__summary { color: var(--muted); font-size: 15px; }
.pcard__foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.pcard__result { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--white); }
.pcard__result svg { color: var(--pink); }
.pcard__result--muted { color: var(--muted); font-weight: 500; }
.pcard__cta { display: inline-flex; align-items: center; gap: 4px; color: var(--lavender); font-weight: 600; white-space: nowrap; }
@keyframes cardIn { from { opacity: 0; transform: translateY(12px); } }

/* Ilustrações dos projetos */
.art { width: 100%; height: 100%; background: linear-gradient(135deg, #241d3d, #1a1424 60%, #1d1424); }
.art svg { width: 100%; height: 100%; }
.a-bar { fill: rgba(196, 181, 253, 0.16); }
.a-light { fill: rgba(248, 250, 252, 0.55); }
.a-acc { fill: var(--violet); }
.a-card { fill: #1f1f30; stroke: rgba(196, 181, 253, 0.25); }
.a-card--acc { fill: rgba(139, 92, 246, 0.3); stroke: var(--violet); }
.a-line { stroke: var(--pink); stroke-width: 2.5; stroke-linecap: round; fill: none; }
.a-ring { fill: none; stroke: rgba(196, 181, 253, 0.15); stroke-width: 12; }
.a-arc { stroke: var(--violet); stroke-width: 12; stroke-linecap: round; }
.a-big { fill: var(--white); font: 700 18px var(--font-display); letter-spacing: 0.08em; }
.a-txt { fill: var(--muted); font: 500 12px var(--font-body); }

/* ---------- Especialidades ---------- */
.skills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.skill { grid-column: span 1; padding: 28px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; transition: border-color 0.3s, transform 0.3s var(--ease); }
.skill--lg { grid-column: span 2; }
.skill::before { content: ""; position: absolute; inset: auto -30% -60% auto; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(139, 92, 246, 0.25), transparent 70%); opacity: 0; transition: opacity 0.4s; }
.skill:hover { border-color: rgba(139, 92, 246, 0.5); transform: translateY(-3px); }
.skill:hover::before { opacity: 1; }
.skill__icon { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: rgba(139, 92, 246, 0.15); color: var(--lavender); border: 1px solid rgba(139, 92, 246, 0.3); margin-bottom: 20px; transition: transform 0.3s var(--ease); }
.skill:hover .skill__icon { transform: rotate(-8deg) scale(1.06); }
.skill__title { font-size: 21px; margin-bottom: 8px; }
.skill__desc { color: var(--muted); font-size: 15px; margin-bottom: 18px; }

/* ---------- Sobre ---------- */
.about { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 64px; align-items: start; }
.photo-slot { aspect-ratio: 4 / 5; border-radius: 28px; border: 1px dashed var(--line-2); display: grid; place-content: center; justify-items: center; gap: 12px; color: var(--muted); font-size: 14px; background: radial-gradient(80% 60% at 50% 30%, rgba(139, 92, 246, 0.18), transparent 70%), var(--card); }
.about__facts { display: grid; gap: 10px; margin-top: 20px; color: var(--muted); font-size: 14.5px; }
.about__facts li { display: flex; align-items: center; gap: 10px; }
.about__facts svg { color: var(--lavender); flex: none; }
.about__p { color: #d4d4dc; font-size: 17px; margin-bottom: 18px; }
.about__copy .btn { margin-top: 10px; }

/* ---------- Timeline ---------- */
.timeline { position: relative; max-width: 760px; padding-left: 36px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(180deg, var(--violet), var(--pink) 80%, transparent); }
.timeline__item { position: relative; padding-bottom: 40px; }
.timeline__item:last-child { padding-bottom: 0; }
.timeline__dot { position: absolute; left: -36px; top: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-2); border: 2px solid var(--violet); }
.timeline__item.is-current .timeline__dot { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 0 6px rgba(236, 72, 153, 0.18); }
.timeline__period { font: 600 14px var(--font-display); color: var(--lavender); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.timeline__title { font-size: 22px; margin-bottom: 6px; }
.timeline__desc { color: var(--muted); }

/* ---------- Playground ---------- */
.lab { border-radius: 28px; border: 1px solid var(--line-2); background: linear-gradient(180deg, var(--card), var(--bg-2)); overflow: hidden; }
.lab__tabs { display: flex; gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.lab__tab { flex: none; padding: 10px 16px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); font-weight: 500; font-size: 14.5px; transition: 0.2s; }
.lab__tab:hover { color: var(--white); }
.lab__tab.is-active { background: rgba(139, 92, 246, 0.18); color: #fff; }
.lab__panel { padding: 28px; min-height: 380px; }
.lab__note { display: flex; align-items: center; gap: 8px; padding: 14px 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.demo__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.demo__title { font: 600 17px var(--font-display); }
.demo__actions { display: flex; gap: 8px; }
.demo__hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
.demo--split { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 28px; }

.wf { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; counter-reset: wf; }
.wf__node { position: relative; padding: 16px; border-radius: 16px; background: #14141f; border: 1px solid var(--line); display: grid; gap: 4px; transition: 0.35s var(--ease); }
.wf__node:not(:last-child)::after { content: ""; position: absolute; top: 50%; right: -13px; width: 14px; height: 2px; background: var(--line-2); }
.wf__node.is-done { border-color: rgba(139, 92, 246, 0.6); background: rgba(139, 92, 246, 0.12); }
.wf__node.is-done:not(:last-child)::after { background: var(--violet); }
.wf__node.is-running { box-shadow: var(--glow); }
.wf__idx { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: rgba(255, 255, 255, 0.06); margin-bottom: 6px; }
.wf__node.is-done .wf__idx { background: var(--violet); }
.wf__name { font-weight: 600; font-size: 15px; }
.wf__desc { font-size: 13px; color: var(--muted); }
.console { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; background: #0b0b12; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-height: 130px; display: grid; gap: 6px; align-content: start; }
.console__ok { color: #34d399; }
.console__muted { color: var(--muted); }

.textarea, .form input, .form textarea, .ask__form input {
  width: 100%; font: inherit; color: var(--white); background: #0f0f18; border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 14px; transition: border-color 0.2s, box-shadow 0.2s;
}
.textarea { resize: vertical; margin-bottom: 14px; font-size: 14.5px; }
.textarea:focus, .form input:focus, .form textarea:focus, .ask__form input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); }
.score { border-radius: 18px; border: 1px solid var(--line); background: #12121c; padding: 22px; }
.score__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 18px; }
.score__avg { font: 700 44px/1 var(--font-display); color: var(--lavender); }
.score__max { color: var(--muted); font-size: 14px; }
.score__list { display: grid; gap: 14px; }
.score__row { display: flex; justify-content: space-between; font-weight: 600; font-size: 14.5px; margin-bottom: 6px; }
.score__why { color: var(--muted); font-size: 13px; margin-top: 6px; }
.meter { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--violet), var(--pink)); transition: width 0.8s var(--ease); }

.chips--wrap { margin-bottom: 22px; }
.agent { display: grid; grid-template-columns: 1fr auto 1fr; grid-template-areas: "user core tools" "answer answer answer"; gap: 24px; align-items: center; }
.agent__user { grid-area: user; padding: 16px; border-radius: 16px 16px 4px 16px; background: rgba(139, 92, 246, 0.16); border: 1px solid rgba(139, 92, 246, 0.35); display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
.agent__user svg { flex: none; margin-top: 3px; color: var(--lavender); }
.agent__core { grid-area: core; width: 150px; height: 150px; border-radius: 50%; display: grid; place-content: center; justify-items: center; gap: 4px; text-align: center; background: radial-gradient(circle, rgba(139, 92, 246, 0.35), rgba(139, 92, 246, 0.05) 70%); border: 1px solid var(--lavender); font: 600 17px var(--font-display); transition: 0.3s; }
.agent__core small { font: 400 12px var(--font-body); color: var(--muted); max-width: 110px; }
.agent__core.is-blocked { border-color: var(--pink); background: radial-gradient(circle, rgba(236, 72, 153, 0.25), transparent 70%); }
.agent__tools { grid-area: tools; display: grid; gap: 10px; }
.agent__tools li { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: #14141f; border: 1px solid var(--line); color: var(--muted); font-size: 14.5px; transition: 0.3s var(--ease); }
.agent__tools li.is-on { color: #fff; border-color: var(--violet); background: rgba(139, 92, 246, 0.14); transform: translateX(-6px); }
.agent__line { position: absolute; right: 100%; top: 50%; width: 24px; height: 2px; background: var(--line-2); }
.agent__tools li.is-on .agent__line { background: var(--violet); }
.agent__step { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--violet); color: #fff; }
.agent__answer { grid-area: answer; padding: 16px 18px; border-radius: 14px; background: #0b0b12; border: 1px solid var(--line); color: #d4d4dc; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
.kpi { padding: 16px; border-radius: 14px; background: #14141f; border: 1px solid var(--line); display: grid; gap: 2px; }
.kpi__v { font: 700 26px var(--font-display); }
.kpi__l { color: var(--muted); font-size: 13px; }
.chart { width: 100%; height: auto; border-radius: 14px; background: #101019; border: 1px solid var(--line); padding: 12px; }
.chart__bar { fill: rgba(139, 92, 246, 0.4); transition: all 0.5s var(--ease); }
.chart__line { stroke: var(--pink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }

/* ---------- Mural de inovação ---------- */
.mural { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 56px; align-items: start; }
.mural__intro .btn { margin-top: 26px; }
.mural__board { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; position: relative; }
.mural__board::before { content: ""; position: absolute; inset: 10% 10%; border: 1px dashed var(--line-2); border-radius: 30px; pointer-events: none; }
.mural__stats { grid-column: span 2; padding: 26px; border-radius: var(--radius); background: linear-gradient(135deg, rgba(139, 92, 246, 0.28), rgba(236, 72, 153, 0.1)); border: 1px solid rgba(139, 92, 246, 0.45); position: relative; }
.mural__tag { font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lavender); margin-bottom: 14px; }
.mural__stats ul { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.mural__stats strong { display: block; font: 700 34px/1 var(--font-display); margin-bottom: 6px; }
.mural__stats span { color: #d4d4dc; font-size: 13.5px; line-height: 1.4; display: block; }
.mural__card { position: relative; padding: 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.mural__card h3 { font-size: 17px; margin-bottom: 8px; }
.mural__card p { color: var(--muted); font-size: 14.5px; }
.mural__pin { position: absolute; top: -6px; left: 22px; width: 12px; height: 12px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.2); }
.mural__note { margin-top: 28px; color: var(--muted); font-size: 13.5px; }

/* ---------- Contato ---------- */
.contact::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(50% 60% at 15% 30%, rgba(139, 92, 246, 0.18), transparent 70%); }
.contact__grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }
.contact__buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
.contact__buttons .btn { justify-content: flex-start; }
.contact__mail { margin-top: 20px; color: var(--muted); font-size: 14px; }
.form { padding: 28px; border-radius: 24px; background: var(--card); border: 1px solid var(--line-2); display: grid; gap: 16px; }
.form__row { display: grid; gap: 6px; }
.form label { font-size: 14px; font-weight: 500; color: #d4d4dc; }
.form input:disabled, .form textarea:disabled { opacity: 0.55; }
.form__status { font-size: 14px; color: var(--muted); min-height: 1.4em; }
.form__status--sent { color: #34d399; }
.form__status--error { color: #f9a8d4; }

/* ---------- Footer ---------- */
.footer { border-top: 1px solid transparent; border-image: linear-gradient(90deg, transparent, var(--violet), var(--pink), transparent) 1; background: #07070c; padding: 56px 0 28px; }
.footer__inner { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 32px; }
.footer__tag { color: var(--muted); margin-top: 6px; font-size: 14px; }
.footer__nav { display: flex; flex-wrap: wrap; gap: 6px 20px; }
.footer__nav a { color: var(--muted); font-size: 14.5px; }
.footer__nav a:hover { color: var(--white); }
.footer__social { display: flex; gap: 10px; }
.footer__social a { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line-2); color: var(--muted); transition: 0.2s; }
.footer__social a:hover { color: #fff; border-color: var(--lavender); }
.footer__bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

/* ---------- Ask Sthephany AI ---------- */
.ask-fab { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: inline-flex; align-items: center; gap: 8px; padding: 13px 18px; border-radius: 999px; border: 1px solid rgba(196, 181, 253, 0.4); background: linear-gradient(135deg, var(--violet), var(--violet-600)); color: #fff; font-weight: 600; font-size: 14.5px; box-shadow: 0 14px 40px -10px rgba(139, 92, 246, 0.85); transition: transform 0.25s var(--ease); }
.ask-fab:hover { transform: translateY(-2px); }
.ask-fab.is-hidden { opacity: 0; pointer-events: none; }
.ask { position: fixed; right: 20px; bottom: 20px; z-index: 61; width: min(400px, calc(100vw - 24px)); height: min(580px, calc(100vh - 110px)); display: flex; flex-direction: column; border-radius: 24px; background: rgba(18, 18, 29, 0.97); backdrop-filter: blur(18px); border: 1px solid var(--line-2); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8), var(--glow); animation: askIn 0.35s var(--ease); overflow: hidden; }
@keyframes askIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } }
.ask__head { display: flex; justify-content: space-between; gap: 12px; padding: 16px 16px 14px 20px; border-bottom: 1px solid var(--line); }
.ask__title { display: flex; align-items: center; gap: 8px; font: 600 16px var(--font-display); }
.ask__title svg { color: var(--lavender); }
.ask__sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.ask__list { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.ask__msg { max-width: 92%; padding: 12px 14px; border-radius: 16px; font-size: 14.5px; white-space: pre-line; }
.ask__msg--bot { background: #1d1d2c; border: 1px solid var(--line); border-bottom-left-radius: 4px; color: #e4e4ea; }
.ask__msg--user { align-self: flex-end; background: var(--violet); border-bottom-right-radius: 4px; }
.ask__sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; white-space: normal; }
.ask__sources a { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--lavender); padding: 3px 9px; border-radius: 999px; border: 1px solid rgba(139, 92, 246, 0.35); }
.ask__suggest { display: grid; gap: 8px; }
.ask__form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.ask__form input { border-radius: 999px; padding: 10px 16px; font-size: 14.5px; }

/* ---------- Página de projeto ---------- */
.case__hero { padding: calc(var(--header-h) + 56px) 0 56px; background: radial-gradient(50% 80% at 80% 0%, rgba(139, 92, 246, 0.25), transparent 70%); border-bottom: 1px solid var(--line); }
.case__back { display: flex; width: fit-content; align-items: center; gap: 6px; color: var(--muted); font-size: 14.5px; margin-bottom: 28px; }
.case__back:hover { color: var(--white); }
.case__title { font-size: clamp(36px, 5vw, 64px); max-width: 900px; margin-bottom: 18px; }
.case__summary { color: var(--muted); font-size: 19px; max-width: 760px; margin-bottom: 24px; }
.case__meta { display: flex; flex-wrap: wrap; gap: 8px; }
.case__layout { display: grid; grid-template-columns: 240px 1fr; gap: 56px; padding-top: 56px; padding-bottom: 96px; }
.case__aside { position: sticky; top: calc(var(--header-h) + 24px); align-self: start; display: grid; gap: 28px; }
.case__aside nav ul { display: grid; gap: 2px; border-left: 1px solid var(--line-2); }
.case__aside nav a { display: block; padding: 6px 14px; color: var(--muted); font-size: 14.5px; margin-left: -1px; border-left: 1px solid transparent; }
.case__aside nav a:hover { color: #fff; border-left-color: var(--violet); }
.case__label { font-size: 12.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lavender); margin-bottom: 12px; }
.case__content { min-width: 0; }
.case__cover { margin: 0 0 48px; border-radius: 24px; overflow: hidden; border: 1px solid var(--line-2); }
.case__cover .art { aspect-ratio: 16 / 7; }
.case__cover figcaption, .gallery figcaption { padding: 10px 16px; font-size: 13px; color: var(--muted); background: var(--card); border-top: 1px solid var(--line); }
.case__block { margin-bottom: 56px; }
.case__block h2 { font-size: 28px; margin-bottom: 16px; }
.case__block h3 { font-size: 19px; margin: 28px 0 10px; }
.case__block p { color: #d4d4dc; font-size: 17px; margin-bottom: 12px; max-width: 760px; }
.case__block .case__muted { color: var(--muted); font-size: 15px; }
.checklist { display: grid; gap: 10px; margin-top: 16px; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; color: #d4d4dc; }
.checklist svg { flex: none; margin-top: 4px; color: var(--lavender); }
.checklist--dot li::before { content: ""; flex: none; width: 7px; height: 7px; margin-top: 10px; border-radius: 50%; background: var(--pink); }
.arch { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 20px; }
.arch__step { position: relative; flex: 1 1 150px; display: grid; gap: 4px; padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line-2); }
.arch__step:not(:last-child)::after { content: "→"; position: absolute; right: -13px; top: 50%; transform: translateY(-50%); color: var(--lavender); font-size: 14px; z-index: 1; }
.arch__idx { font: 600 12px var(--font-display); color: var(--lavender); }
.arch__step strong { font-family: var(--font-display); font-size: 16px; }
.arch__step span:last-child { color: var(--muted); font-size: 13.5px; }
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.results li { padding: 22px; border-radius: 18px; background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(18, 18, 29, 0.6)); border: 1px solid rgba(139, 92, 246, 0.35); display: grid; gap: 6px; }
.results strong { font: 700 36px/1 var(--font-display); }
.results span { color: #d4d4dc; font-size: 15px; }
.results__plain { background: var(--card) !important; border-color: var(--line-2) !important; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.gallery figure { margin: 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
.gallery .art, .gallery img { aspect-ratio: 16 / 9; object-fit: cover; width: 100%; }
.notfound { padding-top: calc(var(--header-h) + 120px); min-height: 70vh; }

/* ---------- Responsivo ---------- */
@media (max-width: 1020px) {
  .slide__inner { grid-template-columns: 1fr; gap: 32px; }
  .slide__visual { max-width: 560px; }
  .metrics__list { grid-template-columns: repeat(3, 1fr); }
  .metric:nth-child(4) { border-left: 0; padding-left: 0; }
  .metric:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
  .bento { grid-template-columns: repeat(2, 1fr); }
  .skills { grid-template-columns: repeat(2, 1fr); }
  .skill--lg { grid-column: span 2; }
  .about, .mural, .contact__grid { grid-template-columns: 1fr; gap: 40px; }
  .about__photo { max-width: 420px; }
  .wf { grid-template-columns: repeat(2, 1fr); }
  .wf__node::after { display: none; }
  .demo--split { grid-template-columns: 1fr; }
  .case__layout { grid-template-columns: 1fr; gap: 32px; }
  .case__aside { position: static; }
  .case__aside nav { display: none; }
}

@media (max-width: 680px) {
  :root { --header-h: 64px; }
  .container { padding: 0 18px; }
  .section { padding: 80px 0; }
  .hero { min-height: auto; }
  .slide { padding: 24px 0 12px; align-items: flex-start; }
  .slide__title { font-size: clamp(34px, 10vw, 44px); }
  .slide__actions .btn { flex: 1 1 100%; }
  .hero__controls { flex-direction: column-reverse; align-items: stretch; gap: 16px; }
  .hero__arrows { justify-content: flex-end; margin-top: -8px; }
  .hero__bar-label { display: none; }
  .metrics__list { grid-template-columns: repeat(2, 1fr); }
  .metric { padding: 24px 14px !important; border-left: 1px solid var(--line) !important; border-bottom: 1px solid var(--line); }
  .metric:nth-child(odd) { border-left: 0 !important; padding-left: 0 !important; }
  .metric:nth-last-child(-n+2) { border-bottom: 0; }
  .bento { grid-template-columns: 1fr; }
  .pcard--lg { grid-column: span 1; }
  .pcard--lg .pcard__media { aspect-ratio: 16 / 8.5; }
  .skills { grid-template-columns: 1fr; }
  .skill--lg { grid-column: span 1; }
  .lab__panel { padding: 18px; }
  .wf { grid-template-columns: 1fr; }
  .agent { grid-template-columns: 1fr; grid-template-areas: "user" "core" "tools" "answer"; justify-items: stretch; }
  .agent__core { justify-self: center; width: 120px; height: 120px; }
  .agent__line { display: none; }
  .agent__tools li.is-on { transform: none; }
  .kpis { gap: 8px; }
  .kpi { padding: 12px; }
  .kpi__v { font-size: 20px; }
  .mural__board { grid-template-columns: 1fr; }
  .mural__stats { grid-column: span 1; }
  .mural__stats ul { grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .contact__buttons { grid-template-columns: 1fr; }
  .arch__step { flex-basis: 100%; }
  .arch__step:not(:last-child)::after { content: "↓"; right: auto; left: 50%; top: auto; bottom: -15px; transform: translateX(-50%); }
  .ask-fab span { display: none; }
  .ask-fab { padding: 15px; }
  .ask { right: 12px; bottom: 12px; height: min(560px, calc(100vh - 90px)); }
}

/* ---------- Movimento reduzido ---------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
